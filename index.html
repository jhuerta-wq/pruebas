<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiencia Low Poly y Parallax</title>
    <style>
        /* Reset y configuración de scroll */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html {
            width: 100%;
            background-color: #050510;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden;
        }

        /* El Canvas vive en el fondo sin interferir con los clics o el scroll */
        #glcanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none; 
        }

        /* Contenedor principal para las 3 secciones (cada una de 1 pantalla de alto) */
        #content-wrapper {
            position: relative;
            z-index: 10;
        }

        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Estilos de Tipografía con colores fuertes */
        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff007f, #00dfd8, #ffea00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 0, 128, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        p {
            font-size: 1.2rem;
            color: #a0aec0;
            max-width: 600px;
            background: rgba(5, 5, 16, 0.7);
            padding: 15px 30px;
            border-radius: 10px;
            border: 1px solid rgba(0, 223, 216, 0.3);
        }

        /* --- Animación Autónoma CSS 3D --- */
        .scene-3d {
            perspective: 1000px;
            width: 200px;
            height: 200px;
            margin-top: 40px;
        }
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: spinCube 10s infinite linear;
        }
        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(255, 0, 128, 0.1);
            border: 3px solid #ff007f;
            box-shadow: inset 0 0 40px rgba(255, 0, 128, 0.5);
        }
        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); border-color: #00dfd8; box-shadow: inset 0 0 40px rgba(0,223,216,0.5);}
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes spinCube {
            0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg); }
        }

        /* Ajuste de la última sección para dejar ver el paisaje */
        #sec3 h1 { margin-top: -40vh; } 
    </style>
</head>
<body>

    <!-- Canvas para el Arte Generativo (Partículas y Paisaje) -->
    <canvas id="glcanvas"></canvas>

    <!-- Contenido HTML sobre el Canvas -->
    <div id="content-wrapper">
        <section class="section" id="sec1">
            <h1>Colores Reactivos</h1>
            <p>Mueve el ratón para desplazar las partículas de neón. Al hacer scroll, notarás el efecto parallax separando las capas.</p>
        </section>

        <section class="section" id="sec2">
            <h1>Animación Autónoma</h1>
            <div class="scene-3d">
                <div class="cube">
                    <div class="face front"></div>
                    <div class="face back"></div>
                    <div class="face right"></div>
                    <div class="face left"></div>
                    <div class="face top"></div>
                    <div class="face bottom"></div>
                </div>
            </div>
        </section>

        <section class="section" id="sec3">
            <h1>Bosque y Cascada</h1>
            <!-- El paisaje Low Poly se dibuja en el canvas justo aquí -->
        </section>
    </div>

    <script>
        const canvas = document.getElementById('glcanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let scrollY = 0;

        // Variables del ratón
        let mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
        });

        // Configuración de resolución
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initLowPoly();
        }
        window.addEventListener('resize', resize);

        /* =========================================
           1. SISTEMA DE PARTÍCULAS REACTIVAS
           ========================================= */
        let particles = [];
        function initParticles() {
            particles = [];
            // Cubrimos 2 pantallas de alto para el parallax
            for(let i=0; i<150; i++) {
                particles.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight * 2,
                    baseX: Math.random() * window.innerWidth,
                    baseY: Math.random() * window.innerHeight * 2,
                    size: Math.random() * 4 + 1,
                    // Colores fuertes: Fucsia, Cyan y Amarillo
                    color: Math.random() > 0.5 ? '#ff007f' : (Math.random() > 0.5 ? '#00dfd8' : '#ffea00'),
                    vx: 0, vy: 0
                });
            }
        }

        /* =========================================
           2. GENERADOR DE MALLA LOW POLY PROCEDURAL
           ========================================= */
        let nodes = [];
        let polys = [];
        let trees = [];

        function initLowPoly() {
            nodes = [];
            polys = [];
            trees = [];
            const cols = 28;
            const rows = 12;
            const cellW = width / (cols - 1);
            const cellH = 65;
            
            // Generar vértices (Nodos)
            for(let y=0; y<=rows; y++) {
                let row = [];
                for(let x=0; x<=cols; x++) {
                    // Definir la zona de la cascada en el centro
                    let isWater = (x >= cols/2 - 2 && x <= cols/2 + 1);
                    let distCenter = Math.abs(x - cols/2);
                    
                    // Altura: Las montañas suben a los lados, la cascada es plana
                    let elevation = isWater ? 10 : (distCenter * 45) + Math.random() * 120;
                    
                    // Ruido para darle el look de "fractura" Low Poly
                    let jx = (x === 0 || x === cols) ? 0 : (Math.random() - 0.5) * cellW * 0.7;
                    let jy = (Math.random() - 0.5) * cellH * 0.7;

                    let finalY = -(y * cellH) - elevation + jy;

                    let node = {
                        x: x * cellW + jx,
                        y: finalY,
                        baseY: finalY,
                        isWater: isWater,
                        phase: Math.random() * Math.PI * 2 // Para la animación del agua
                    };
                    row.push(node);

                    // Plantar árboles aleatorios en las montañas (no en el agua)
                    if(!isWater && Math.random() > 0.85 && y > 1 && y < rows - 2) {
                        trees.push(node);
                    }
                }
                nodes.push(row);
            }

            // Unir nodos en Triángulos (Polígonos)
            for(let y=0; y<rows; y++) {
                for(let x=0; x<cols-1; x++) {
                    let p1 = nodes[y][x];
                    let p2 = nodes[y][x+1];
                    let p3 = nodes[y+1][x];
                    let p4 = nodes[y+1][x+1];

                    let waterPoly = p1.isWater || p2.isWater;

                    // Lógica de colores matemáticos
                    let hue = waterPoly ? 190 : 140 + Math.random() * 30; // Cyan vs Verde Bosque
                    let sat = waterPoly ? 90 : 35 + Math.random() * 20;
                    let lit = waterPoly ? 60 + Math.random()*15 : 15 + (y/rows)*25 + Math.random()*10;

                    polys.push({
                        pA: p1, pB: p3, pC: p2,
                        color: `hsl(${hue}, ${sat}%, ${lit}%)`,
                        isWater: waterPoly
                    });
                    polys.push({
                        pA: p2, pB: p3, pC: p4,
                        color: `hsl(${hue}, ${sat}%, ${lit - 5}%)`,
                        isWater: waterPoly
                    });
                }
            }

            // Ordenar polígonos de atrás hacia adelante para renderizado correcto en 2D
            polys.sort((a, b) => {
                let avgYa = (a.pA.y + a.pB.y + a.pC.y) / 3;
                let avgYb = (b.pA.y + b.pB.y + b.pC.y) / 3;
                return avgYa - avgYb; 
            });
        }

        // Función para dibujar árboles tipo Low Poly
        function drawTree(x, y) {
            ctx.fillStyle = '#071f11'; // Sombra del pino
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x - 20, y + 50);
            ctx.lineTo(x + 20, y + 50);
            ctx.fill();
            
            ctx.fillStyle = '#103d21'; // Cara iluminada del pino
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 50);
            ctx.lineTo(x + 20, y + 50);
            ctx.fill();
            
            ctx.fillStyle = '#26160d'; // Tronco
            ctx.fillRect(x - 4, y + 50, 8, 15);
        }

        /* =========================================
           3. MOTOR DE RENDERIZADO Y ANIMACIÓN
           ========================================= */
        function render(time) {
            // Limpiar frame
            ctx.fillStyle = '#050510';
            ctx.fillRect(0, 0, width, height);

            // --- CAPA 1: Partículas (Con efecto Parallax) ---
            ctx.save();
            ctx.translate(0, -scrollY * 0.4); // Velocidad Parallax
            
            let actualMouseY = mouse.y + scrollY * 0.4; // Ajustar hit-box del ratón al scroll

            particles.forEach(p => {
                // Física de repulsión del ratón
                let dx = mouse.x - p.x;
                let dy = actualMouseY - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist < 150) {
                    p.vx -= (dx / dist) * 1.5;
                    p.vy -= (dy / dist) * 1.5;
                }
                
                // Retorno al origen y fricción
                p.vx += (p.baseX - p.x) * 0.02;
                p.vy += (p.baseY - p.y) * 0.02;
                p.vx *= 0.85; p.vy *= 0.85;
                p.x += p.vx;  p.y += p.vy;

                // Dibujar partícula
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            });
            ctx.shadowBlur = 0; // Apagar glow para el paisaje
            ctx.restore();

            // --- CAPA 2: Paisaje Low Poly ---
            ctx.save();
            // Anclar el paisaje a la tercera sección de la página
            let landscapeScreenY = (height * 3) - scrollY; 
            ctx.translate(0, landscapeScreenY);

            // Animar los vértices del agua (Efecto cascada fluyendo)
            nodes.forEach(row => {
                row.forEach(n => {
                    if(n.isWater) {
                        n.y = n.baseY + Math.sin(time * 0.004 + n.phase) * 12;
                    }
                });
            });

            // Dibujar la malla de polígonos
            polys.forEach(poly => {
                ctx.fillStyle = poly.color;
                ctx.strokeStyle = poly.color; // Evitar líneas blancas entre triángulos
                ctx.lineWidth = 1;
                
                ctx.beginPath();
                ctx.moveTo(poly.pA.x, poly.pA.y);
                ctx.lineTo(poly.pB.x, poly.pB.y);
                ctx.lineTo(poly.pC.x, poly.pC.y);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            });

            // Dibujar los árboles sobre la malla
            trees.forEach(t => {
                drawTree(t.x, t.y - 45); // Desfasado hacia arriba para anclar la base
            });

            ctx.restore();

            requestAnimationFrame(render);
        }

        // Inicializar todo
        resize();
        initParticles();
        requestAnimationFrame(render);

    </script>
</body>
</html>
